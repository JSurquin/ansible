---
- name: Aktualizacja cache APT
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Instalacja Nginx
  apt:
    name: "{{ nginx_package }}"
    state: present

- name: Utworzenie katalogu strony www
  file:
    path: "{{ nginx_document_root }}"
    state: directory
    mode: '0755'

- name: Wdrożenie konfiguracji Nginx
  template:
    src: nginx.conf.j2
    dest: "{{ nginx_config_path }}"
    mode: '0644'
  notify: restart nginx

- name: Włączenie wdrożonego vhost (sites-enabled)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    src: "{{ nginx_config_path }}"
    state: link
    force: true
  notify: restart nginx

- name: Wdrożenie strony głównej
  template:
    src: index.html.j2
    dest: "{{ nginx_document_root }}/index.html"
    mode: '0644'
  notify: restart nginx

- name: Upewnij się, że Nginx jest uruchomiony i włączony
  service:
    name: "{{ nginx_service }}"
    state: started
    enabled: yes
