---
- name: Aktualizacja cache APT
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Instalacja Apache2
  apt:
    name: "{{ apache_package }}"
    state: present

- name: Utworzenie katalogu strony www
  file:
    path: "{{ apache_document_root }}"
    state: directory
    mode: '0755'

- name: Wdrożenie konfiguracji Apache2
  template:
    src: apache2.conf.j2
    dest: "{{ apache_config_path }}"
    mode: '0644'
  notify: restart apache2

- name: Wdrożenie strony głównej
  template:
    src: index.html.j2
    dest: "{{ apache_document_root }}/index.html"
    mode: '0644'

- name: Upewnij się, że Apache2 jest uruchomiony i włączony
  service:
    name: "{{ apache_service }}"
    state: started
    enabled: yes
