---
# Global variables for all servers
# 
# Note: Specific variables are now defined in:
#   - ansible_connection: Defined in each inventory (inventories/*.yml)
#   - Ports and config: Defined in each role's vars (roles/*/vars/main.yml)
#
# This file can contain truly global variables for all environments
# For example:
#   company_name: "My Company"
#   timezone: "Europe/Paris"
#   ntp_server: "pool.ntp.org"
